groups:
  - name: elevora-platform-alerts
    rules:
      - alert: HighCpuUsage
        expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: CPU usage is above 80 percent
          description: Instance {{ $labels.instance }} CPU usage is above 80 percent for 5 minutes.

      - alert: HighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Memory usage is above 85 percent
          description: Instance {{ $labels.instance }} memory usage is above 85 percent for 5 minutes.

      - alert: HighHttpErrorRate
        expr: |
          (
            sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1)
          ) * 100 > 5
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: HTTP 5xx error rate is above 5 percent
          description: Backend HTTP error rate exceeded 5 percent for 5 minutes.
