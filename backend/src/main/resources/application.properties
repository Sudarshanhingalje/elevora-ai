spring.application.name=elevora-ai
spring.config.import=optional:file:../.env[.properties]
server.port=8080
server.forward-headers-strategy=framework

spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null
spring.mvc.problemdetails.enabled=true

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${MYSQL_PORT:3307}/${DB_NAME:elevora_ai}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:elevora_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.pool-name=ElevoraAiHikariPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=true
spring.flyway.default-schema=${DB_NAME:elevora_ai}
spring.flyway.user=${DB_USERNAME:elevora_app}
spring.flyway.password=${DB_PASSWORD}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=2s
spring.data.redis.client-type=lettuce
spring.data.redis.lettuce.pool.enabled=true
spring.data.redis.lettuce.pool.max-active=16
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when_authorized
management.health.mail.enabled=true
management.metrics.tags.application=${spring.application.name}

logging.level.root=INFO
logging.level.com.elevoraai=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS,Asia/Kolkata} %-5level [%thread] %logger{36} - %msg%n

app.timezone=Asia/Kolkata
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:3000}
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${CORS_ALLOWED_ORIGIN:https://elevora.ai}}
app.security.cookie.secure=${SECURE_COOKIES:false}
app.security.cookie.same-site=${JWT_COOKIE_SAME_SITE:Strict}
app.security.bcrypt.cost=${BCRYPT_COST:12}
app.security.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:100}
app.security.rate-limit.window-seconds=60
app.security.failed-login.max-attempts=${FAILED_LOGIN_MAX_ATTEMPTS:5}
app.security.failed-login.lock-minutes=${FAILED_LOGIN_LOCK_MINUTES:15}

app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiry-seconds=${JWT_EXPIRY:900}
app.jwt.refresh-token-expiry-seconds=${JWT_REFRESH_EXPIRY:604800}
app.jwt.access-cookie-name=${JWT_COOKIE_NAME:elevora_access_token}
app.jwt.refresh-cookie-name=${JWT_REFRESH_COOKIE_NAME:elevora_refresh_token}
app.jwt.cookie-http-only=${JWT_COOKIE_HTTP_ONLY:true}

app.otp.expiry-seconds=${OTP_EXPIRY_SECONDS:300}
app.mail.from=${MAIL_FROM:elevoraai.team@gmail.com}
app.owner.email=${OWNER_EMAIL:}
app.owner.password=${OWNER_PASSWORD:}
app.owner.tenant-slug=${OWNER_TENANT_SLUG:elevora-ai}
app.owner.tenant-name=${OWNER_TENANT_NAME:Elevora AI}

app.oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
app.oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}

app.ollama.base-url=${OLLAMA_HOST:http://localhost:11434}
app.ollama.chat-model=${OLLAMA_CHAT_MODEL:llama3:8b}
app.ollama.embedding-model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}

app.stable-diffusion.base-url=${STABLE_DIFFUSION_BASE_URL:}
app.comfyui.workflow-path=${COMFYUI_WORKFLOW_PATH:}
app.instagram.graph-base-url=${INSTAGRAM_GRAPH_BASE_URL:https://graph.instagram.com}
app.instagram.business-account-id=${INSTAGRAM_BUSINESS_ACCOUNT_ID:}
app.instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}
app.wordpress.base-url=${WORDPRESS_BASE_URL:}
app.wordpress.username=${WORDPRESS_USERNAME:}
app.wordpress.application-password=${WORDPRESS_APPLICATION_PASSWORD:}

app.n8n.base-url=${N8N_BASE_URL:http://localhost:5678}
app.n8n.webhook-base-url=${N8N_WEBHOOK_URL:http://localhost:5678/webhook}
app.n8n.campaign-webhook-secret=${N8N_CAMPAIGN_SECRET:elevora-n8n-secret-change-me}
app.whatsapp.business-phone-number-id=${WHATSAPP_BUSINESS_PHONE_NUMBER_ID:}
app.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
app.whatsapp.graph-base-url=${WHATSAPP_GRAPH_BASE_URL:https://graph.facebook.com/v20.0}
app.facebook.page-id=${FACEBOOK_PAGE_ID:}
app.facebook.page-access-token=${FACEBOOK_PAGE_ACCESS_TOKEN:}

app.qdrant.base-url=http://${QDRANT_HOST:localhost}:${QDRANT_HTTP_PORT:6333}
app.qdrant.api-key=${QDRANT_API_KEY}
app.qdrant.collection=${QDRANT_COLLECTION:elevora_knowledge}

app.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
app.minio.access-key=${MINIO_ACCESS_KEY:${MINIO_ROOT_USER}}
app.minio.secret-key=${MINIO_SECRET_KEY:${MINIO_ROOT_PASSWORD}}
app.minio.bucket=${MINIO_BUCKET:elevora-assets}

app.razorpay.key-id=${RAZORPAY_KEY_ID:${RAZORPAY_KEY}}
app.razorpay.secret=${RAZORPAY_SECRET:}
app.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
